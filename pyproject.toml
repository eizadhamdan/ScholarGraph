[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scholargraph"
version = "0.1.0"
description = "ScholarGraph"
requires-python = ">=3.12,<3.13"

dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.8,<1.0",
]

[tool.setuptools.packages.find]
where = ["src"]
